joy_teleop:
  ros__parameters:
    # Normal speed mode (Button 5 [R1] as deadman) 
    move:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: agribot_diff_controller/cmd_vel
      deadman_buttons: [ 5 ]
      axis_mappings:
        twist-linear-x:
          axis: 1
          scale: 2.0
          offset: 0.0
        twist-angular-z:
          axis: 3
          scale: 3.0
          offset: 0.0

    # Turbo mode (Button 7 [R2] as turbo deadman) - 5x speed
    move_turbo:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: agribot_diff_controller/cmd_vel
      deadman_buttons: [ 7 ] # Different button for turbo
      axis_mappings:
        twist-linear-x:
          axis: 1
          scale: 5.0 # 5x linear speed
          offset: 0.0
        twist-angular-z:
          axis: 3
          scale: 5.0 # 5x angular speed
          offset: 0.0
